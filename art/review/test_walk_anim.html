<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; display: flex; gap: 40px; padding: 40px; }
  .box { text-align: center; }
  .view { width: 48px; height: 48px; transform: scale(4); transform-origin: top left; margin: 40px; border: 1px solid #444; image-rendering: pixelated; }
</style>
</head>
<body>
  <div class="box">
    <h3>Previous (Frozen Legs)</h3>
    <div id="v_old" class="view" style="background-image: url('../../game/img/characters/$UF_Human_Male_Walk.png'); background-position: 0px -96px;"></div>
  </div>
  <div class="box">
    <h3>New Combo 2 (Dynamic Walking Legs)</h3>
    <div id="v_new" class="view" style="background-image: url('walk_side_combo2.png'); background-position: 0px 0px;"></div>
  </div>

<script>
  const seq = [0, 1, 2, 1];
  let idx = 0;
  setInterval(() => {
    idx = (idx + 1) % seq.length;
    const f = seq[idx];
    document.getElementById('v_old').style.backgroundPosition = (-f * 48) + 'px -96px';
    document.getElementById('v_new').style.backgroundPosition = (-f * 48) + 'px 0px';
  }, 180);
</script>
</body>
</html>
