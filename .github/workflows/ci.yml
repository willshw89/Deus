name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (node --check on game/js/plugins/*.js and tools/**/*.js)
        run: node tools/ci/syntax_check.js
      - name: Root hygiene (no stray .js/.png/.zip in repo root)
        run: node tools/ci/check_root.js
